<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="robots" content="index,follow">
  <title>$title · $name</title>
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="mobile-header"><a href="index.html">$name</a><button class="menu-toggle" aria-expanded="false" aria-controls="site-navigation">Menu <span aria-hidden="true">☰</span></button></header>
  <aside class="sidebar">
    <a class="site-name" href="index.html">$name</a>
    <p class="site-role">$role</p>
    <nav id="site-navigation" aria-label="Main navigation">$navigation</nav>
    <div class="sidebar-footer"><span>ACADEMIC HOMEPAGE</span><p>$sidebar_topics</p>$sidebar_email</div>
  </aside>
  <main id="main" tabindex="-1">
    $sample_notice
    $content
    <footer class="footer"><span>$name · Academic Homepage</span><a href="#main">Back to top ↑</a></footer>
  </main>
</body>
</html>
